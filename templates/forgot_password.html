<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password · Serenity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth_reset.css') }}">
</head>
<body>

<div class="auth-card">
  <div class="auth-icon" aria-hidden="true">🔑</div>
  <h1 class="auth-title">Forgot your password?</h1>
  <p class="auth-subtitle">Enter the email on your Serenity account and we'll send you a link to reset it.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="auth-flash auth-flash--{{ 'error' if category == 'error' else 'success' }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('forgot_password') }}">
    <input type="hidden" name="csrf_token" value="">

    <div class="auth-field">
      <label class="auth-label" for="email">Email address</label>
      <input class="auth-input" type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
    </div>

    <button type="submit" class="auth-btn">Send Reset Link</button>
  </form>

  <a href="{{ url_for('login') }}" class="auth-back">← Back to Login</a>
</div>

</body>
</html>
